[package]
name = "cmme-core"
version = "0.1.0"
edition = "2021"
description = "Cœur métier CMME : domaine, stockage chiffré SQLCipher, import, export, sauvegarde"
license = "UNLICENSED"
publish = false

[dependencies]
rusqlite = { version = "0.40", features = ["bundled-sqlcipher-vendored-openssl", "serde_json", "backup"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
sha2 = "0.10"
hex = "0.4"
getrandom = "0.3"
argon2 = { version = "0.5", features = ["std"] }
calamine = { version = "0.36", features = ["dates"] }
csv = "1.4"
unicode-normalization = "0.1"
keyring = { version = "3.6", features = ["apple-native"] }
zeroize = "1.8"

[dev-dependencies]
tempfile = "3"
rust_xlsxwriter = "0.90"
hex = "0.4"
sha2 = "0.10"
