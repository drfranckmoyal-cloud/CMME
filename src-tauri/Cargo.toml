[package]
name = "cmme-app"
version = "1.0.0"
edition = "2021"
description = "CMME — recueil clinique dentaire et statistiques"
license = "UNLICENSED"
publish = false

[lib]
name = "cmme_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
cmme-core = { path = "../crates/core" }
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
